# Blueprint de Render: con esto, «New + → Blueprint» crea el servicio solo.
# Documentación: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: carta-natal
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # opcional: la base de la sincronización entre dispositivos (Neon). Ver README, «Sincronizar entre dispositivos»
      - key: CARTA_NATAL_SYNC_DB
        sync: false
